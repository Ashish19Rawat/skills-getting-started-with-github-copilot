<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test: High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>
        <svg
          class="school-logo"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 48 48"
          width="48"
          height="48"
          role="img"
          aria-labelledby="logo-title"
        >
          <title id="logo-title">Mergington High School crest</title>
          <path d="M24 3 42 10v13c0 11-7.5 18-18 22C13.5 41 6 34 6 23V10L24 3Z" fill="#1f4e79" />
          <path d="M24 7 38 12v11c0 8.5-5.3 14.5-14 18-8.7-3.5-14-9.5-14-18V12l14-5Z" fill="#fff" />
          <path d="M24 10 35 14v9c0 6.5-4 11.5-11 14.5C17 34.5 13 29.5 13 23v-9l11-4Z" fill="#d9a441" />
          <path d="M16 20h16v11H16z" fill="#fff" />
          <path d="M24 20v11m-8-8 8 2 8-2" fill="none" stroke="#1f4e79" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" />
        </svg>
        Mergington High School
      </h1>
      <h2>Extracurricular Activities</h2>
    </header>

    <main>
      <section id="activities-container">
        <h3>Available Activities</h3>
        <div id="activities-list">
          <!-- Activities will be loaded here -->
          <p>Loading activities...</p>
        </div>
      </section>

      <section id="signup-container">
        <h3>Sign Up for an Activity</h3>
        <form id="signup-form">
          <div class="form-group">
            <label for="email">Student Email:</label>
            <input type="email" id="email" required placeholder="your-email@mergington.edu" />
          </div>
          <div class="form-group">
            <label for="activity">Select Activity:</label>
            <select id="activity" required>
              <option value="">-- Select an activity --</option>
              <!-- Activity options will be loaded here -->
            </select>
          </div>
          <button type="submit">Sign Up</button>
        </form>
        <div id="message" class="hidden"></div>
      </section>
    </main>

    <footer>
      <p>&copy; 2023 Mergington High School</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
